name: Build installer

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: LeagueProximityChat
  MAIN_CLASS: me.bedwarshurts.leagueproximitychat.LeagueProximityChat
  UPGRADE_UUID: 05F33DB0-402A-34CF-B180-106B36672AF9
  PRERELEASES_PER_VERSION: 5

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      is_release: ${{ steps.meta.outputs.is_release }}
      is_snapshot: ${{ steps.meta.outputs.is_snapshot }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Work out version, build number and release type
        id: meta
        shell: pwsh
        run: |
          $pomVersion = (mvn -B -q help:evaluate "-Dexpression=project.version" -DforceStdout).Trim()
          $isSnapshot = $pomVersion.EndsWith("-SNAPSHOT")
          $version = $pomVersion -replace '-SNAPSHOT$', ''
          $build = (git rev-list --count HEAD).Trim()
          $onMaster = "${{ github.ref }}" -eq "refs/heads/master"
          $alreadyReleased = [bool](git tag --list $version "v$version")

          $isRelease = $onMaster -and -not $isSnapshot -and -not $alreadyReleased

          "version=$version" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          "is_release=$($isRelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "is_snapshot=$($isSnapshot.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "pom.xml version $pomVersion -> version $version, build $build, stable release: $isRelease"

      - name: Build the jar
        run: mvn -B package -DskipTests

      - name: Ensure WiX Toolset 3
        shell: pwsh
        run: |
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset -y --no-progress
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1
          }
          if (-not $wix) { throw "WiX Toolset 3 could not be installed." }
          Write-Host "Using $($wix.FullName)"
          "$($wix.FullName)\bin" >> $env:GITHUB_PATH

      - name: Find the Windows SDK tools
        shell: pwsh
        run: |
          foreach ($tool in "mt", "signtool") {
            $exe = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter "$tool.exe" |
              Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $exe) { throw "$tool.exe not found." }
            "$($tool.ToUpper())=$($exe.FullName)" >> $env:GITHUB_ENV
          }

      - name: Load the signing certificate
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
        run: |
          if (-not $env:SIGNING_CERT_BASE64) {
            if ("${{ steps.meta.outputs.is_release }}" -eq "true") { throw "Signing secrets are not set up - refusing to publish an unsigned release." }
            Write-Host "::warning::Signing secrets are not set up - this test build is unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          "SIGNING_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Build the app image with jpackage
        shell: pwsh
        run: |
          $jar = Get-ChildItem target -Filter "leagueproximitychat-*.jar" | Where-Object { $_.Name -notlike "original-*" } | Select-Object -First 1
          if (-not $jar) { throw "Shaded jar not found in target/." }
          New-Item -ItemType Directory -Force build_input | Out-Null
          Copy-Item $jar.FullName build_input/
          jpackage `
            --type app-image `
            --name "$env:APP_NAME" `
            --app-version "${{ steps.meta.outputs.version }}" `
            --vendor "Fate Sealed" `
            --input build_input `
            --main-jar $jar.Name `
            --main-class "$env:MAIN_CLASS" `
            --dest build_image `
            --icon packaging/icon.ico
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed." }

      - name: Make the app require admin privileges
        shell: pwsh
        run: |
          # Only the execution level changes; the launcher's other manifest settings (DPI awareness etc.) are kept.
          $launcher = Get-Item "build_image/$env:APP_NAME/$env:APP_NAME.exe"
          $manifest = Join-Path $env:RUNNER_TEMP "launcher.manifest"
          & $env:MT -nologo "-inputresource:$($launcher.FullName);#1" "-out:$manifest"
          if ($LASTEXITCODE -ne 0) { throw "Reading the launcher manifest failed." }
          $content = Get-Content $manifest -Raw
          if ($content -notmatch 'level="asInvoker"') { throw "Unexpected launcher manifest:`n$content" }
          [IO.File]::WriteAllText($manifest, ($content -replace 'level="asInvoker"', 'level="requireAdministrator"'))
          $launcher.IsReadOnly = $false
          & $env:MT -nologo -manifest $manifest "-outputresource:$($launcher.FullName);#1"
          if ($LASTEXITCODE -ne 0) { throw "Embedding the launcher manifest failed." }

      - name: Sign the app launcher
        if: env.SIGNING_PFX != ''
        shell: pwsh
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $launcher = "build_image/$env:APP_NAME/$env:APP_NAME.exe"
          & $env:SIGNTOOL sign /f $env:SIGNING_PFX /p $env:SIGNING_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            /d "$env:APP_NAME" /du "https://github.com/${{ github.repository }}" $launcher
          if ($LASTEXITCODE -ne 0) { throw "Signing failed." }
          (Get-Item $launcher).IsReadOnly = $true

      - name: Package the installer with jpackage
        shell: pwsh
        run: |
          jpackage `
            --type exe `
            --app-image "build_image/$env:APP_NAME" `
            --name "$env:APP_NAME" `
            --app-version "${{ steps.meta.outputs.version }}" `
            --vendor "Fate Sealed" `
            --dest build_output `
            --icon packaging/icon.ico `
            --resource-dir packaging/jpackage `
            --win-upgrade-uuid "$env:UPGRADE_UUID" `
            --win-shortcut `
            --win-menu
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed." }
          $jar = Get-ChildItem build_input -Filter "*.jar" | Select-Object -First 1
          Copy-Item $jar.FullName "build_output/$env:APP_NAME-${{ steps.meta.outputs.version }}.jar"

      - name: Add require admin perms manifest to the installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem build_output -Filter "*.exe" | Select-Object -First 1
          & $env:MT -nologo -manifest packaging/installer.manifest "-outputresource:$($installer.FullName);#1"
          if ($LASTEXITCODE -ne 0) { throw "Embedding the manifest failed." }

      - name: Sign the installer
        if: env.SIGNING_PFX != ''
        shell: pwsh
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $installer = Get-ChildItem build_output -Filter "*.exe" | Select-Object -First 1
          & $env:SIGNTOOL sign /f $env:SIGNING_PFX /p $env:SIGNING_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            /d "$env:APP_NAME" /du "https://github.com/${{ github.repository }}" $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signing failed." }
          $signature = Get-AuthenticodeSignature $installer.FullName
          Write-Host "Signed by: $($signature.SignerCertificate.Subject)"

      - name: Remove the signing certificate
        if: always() && env.SIGNING_PFX != ''
        shell: pwsh
        run: Remove-Item $env:SIGNING_PFX -Force -ErrorAction SilentlyContinue

      - name: Name the files
        shell: pwsh
        run: |
          $installer = Get-ChildItem build_output -Filter "*.exe" | Select-Object -First 1
          if ("${{ steps.meta.outputs.is_release }}" -eq "true") {
            $name = "$env:APP_NAME-${{ steps.meta.outputs.version }}.exe"
          } else {
            $name = "$env:APP_NAME-${{ steps.meta.outputs.version }}-b${{ steps.meta.outputs.build }}.exe"
          }
          Rename-Item $installer.FullName $name
          Get-ChildItem build_output | ForEach-Object { Write-Host "$($_.Name)  ($([math]::Round($_.Length / 1MB, 1)) MB)" }

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}-b${{ steps.meta.outputs.build }}
          path: build_output/*
          retention-days: 14
          if-no-files-found: error

  prerelease:
    needs: build
    if: github.ref == 'refs/heads/master' && needs.build.outputs.is_release != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-${{ needs.build.outputs.version }}-b${{ needs.build.outputs.build }}
          path: release_files

      - name: Publish a pre-release for this build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          TAG="$VERSION-b$BUILD"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release_files/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          {
            echo "Dev build of commit [${GITHUB_SHA::7}](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)."
            if [ -n "$COMMIT_MESSAGE" ]; then
              echo
              echo "${COMMIT_MESSAGE%%$'\n'*}"
            fi
          } > notes.md
          gh release create "$TAG" release_files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Development build $VERSION (build $BUILD)" \
            --notes-file notes.md

      - name: Keep only the newest pre-releases of this version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          KEEP: ${{ env.PRERELEASES_PER_VERSION }}
        run: |
          OLD_TAGS=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isPrerelease \
              --jq ".[] | select(.isPrerelease and (.tagName | startswith(\"$VERSION-b\"))) | .tagName" \
            | awk -F'-b' '{ print $NF " " $0 }' \
            | sort -k1,1nr \
            | tail -n +$((KEEP + 1)) \
            | cut -d' ' -f2)
          for tag in $OLD_TAGS; do
            echo "Deleting old pre-release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done

  release:
    needs: build
    if: github.ref == 'refs/heads/master' && needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-${{ needs.build.outputs.version }}-b${{ needs.build.outputs.build }}
          path: release_files

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PREVIOUS=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')
          ARGS=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes --latest)
          if [ -n "$PREVIOUS" ]; then
            ARGS+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$VERSION" release_files/* "${ARGS[@]}"

  maven-package:
    needs: build
    if: github.ref == 'refs/heads/master' && (needs.build.outputs.is_snapshot == 'true' || needs.build.outputs.is_release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Publish the jar to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mvn -B deploy -DskipTests
