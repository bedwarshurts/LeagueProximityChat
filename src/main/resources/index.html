<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends Proximity Chat</title>
    <script src="livekit-client.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-0: #02060c;
            --panel-hi: rgba(12, 22, 36, 0.94);
            --panel-lo: rgba(6, 12, 22, 0.96);
            --hairline: rgba(200, 170, 110, 0.16);
            --hairline-soft: rgba(240, 230, 210, 0.07);
            --ink-1: #f0e6d2;
            --ink-2: #a8a290;
            --ink-3: #6b7585;
            --gold: #c8aa6e;
            --gold-soft: #cdbe91;
            --gold-deep: #785a28;
            --teal: #0ac8b9;
            --danger: #e8455a;
            --warn: #f0b232;
            --display: 'Cinzel', 'Times New Roman', serif;
            --mono: 'Cascadia Mono', ui-monospace, 'SF Mono', Consolas, monospace;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            margin: 0;
            color: var(--ink-1);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            background:
                radial-gradient(1100px 620px at 78% -12%, rgba(10, 200, 185, 0.09), transparent 60%),
                radial-gradient(900px 560px at 6% 112%, rgba(200, 170, 110, 0.07), transparent 55%),
                linear-gradient(180deg, #04090f, var(--bg-0) 55%, #020509);
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(rgba(200, 170, 110, 0.10) 1px, transparent 1.6px);
            background-size: 30px 30px;
            -webkit-mask-image: radial-gradient(circle at 50% 38%, #000, transparent 85%);
            mask-image: radial-gradient(circle at 50% 38%, #000, transparent 85%);
        }

        #main-ui {
            position: relative;
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 14px;
            padding: 18px 20px;
        }

        .panel {
            position: relative;
            z-index: 0;
            min-height: 0;
            background: linear-gradient(165deg,
                rgba(200, 170, 110, 0.60),
                rgba(200, 170, 110, 0.13) 30%,
                rgba(10, 200, 185, 0.15) 70%,
                rgba(200, 170, 110, 0.42));
            clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px),
                calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
            filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.45));
        }
        .panel::before {
            content: '';
            position: absolute;
            inset: 1px;
            z-index: -1;
            background:
                radial-gradient(130% 100% at 50% 0%, rgba(18, 34, 52, 0.55), transparent 55%),
                linear-gradient(180deg, var(--panel-hi), var(--panel-lo));
            clip-path: polygon(13px 0, calc(100% - 13px) 0, 100% 13px, 100% calc(100% - 13px),
                calc(100% - 13px) 100%, 13px 100%, 0 calc(100% - 13px), 0 13px);
        }

        .command-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px 18px;
            padding: 12px 20px;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-mark { width: 40px; height: 44px; flex-shrink: 0; }
        .brand-mark svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 9px rgba(10, 200, 185, 0.35)); }
        .brand h1 {
            margin: 0;
            font-family: var(--display);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #f0e6d2 15%, #c8aa6e 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand p { margin: 3px 0 0; font-size: 11.5px; color: var(--ink-3); letter-spacing: 0.02em; }

        .hud-status { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 7px 12px;
            border-radius: 2px;
            background: rgba(3, 9, 16, 0.55);
            border: 1px solid var(--hairline);
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-2);
            white-space: nowrap;
        }

        .status::before {
            content: '';
            width: 7px;
            height: 7px;
            flex-shrink: 0;
            transform: rotate(45deg);
            background: var(--ink-3);
            transition: 0.2s;
        }
        .status.success { color: var(--ink-1); border-color: rgba(10, 200, 185, 0.35); }
        .status.success::before { background: var(--teal); box-shadow: 0 0 8px rgba(10, 200, 185, 0.75); }
        .status.error { border-color: rgba(232, 69, 90, 0.30); }
        .status.error::before { background: var(--danger); box-shadow: 0 0 8px rgba(232, 69, 90, 0.55); }
        .status.loading { color: var(--ink-1); border-color: rgba(240, 178, 50, 0.35); }
        .status.loading::before { background: var(--warn); box-shadow: 0 0 8px rgba(240, 178, 50, 0.6); animation: pulse 1.1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .squad-panel { display: flex; flex-direction: column; padding: 18px 20px; }
        .roster-head {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            margin-bottom: 4px;
            border-bottom: 1px solid var(--hairline);
        }
        .roster-head::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -4px;
            width: 7px;
            height: 7px;
            transform: translateX(-50%) rotate(45deg);
            background: #0a1420;
            border: 1px solid rgba(200, 170, 110, 0.45);
        }
        .section-label {
            margin: 0;
            font-family: var(--display);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gold-soft);
        }
        .roster-count {
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 700;
            color: var(--gold-soft);
            background: rgba(200, 170, 110, 0.08);
            border: 1px solid var(--hairline);
            border-radius: 2px;
            padding: 2px 9px;
        }
        #roster-container { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 6px 0 2px; scrollbar-width: thin; scrollbar-color: rgba(200, 170, 110, 0.3) transparent; }
        #roster-container::-webkit-scrollbar { width: 8px; }
        #roster-container::-webkit-scrollbar-thumb { background: rgba(200, 170, 110, 0.22); border-radius: 4px; }

        .player-item {
            position: relative;
            z-index: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 27px 14px;
            border-bottom: 1px solid var(--hairline-soft);
            font-size: 14px;
            transition: background 0.12s;
        }
        .player-item:hover { background: rgba(200, 170, 110, 0.045); }
        .player-item:last-child { border-bottom: none; }

        .player-splash {
            position: absolute;
            inset: 0;
            z-index: -1;
            background-repeat: no-repeat;
            background-size: 750px auto;
            background-position: left 25%;
            opacity: 0;
            filter: brightness(0.85) contrast(1.05);
            transition: opacity 0.4s ease, filter 0.2s ease;
        }
        .player-item.has-splash .player-splash { opacity: 1; }

        .player-item.has-splash:hover .player-splash,
        .player-item.speaking .player-splash {
            filter: brightness(1.22) contrast(1.10);
        }

        .player-splash::after {
            content: '';
            position: absolute;
            inset: 0;

            background: linear-gradient(90deg,
            rgba(4, 10, 18, 0.0) 0%,
            rgba(4, 10, 18, 0.15) 30%,
            rgba(4, 10, 18, 0.50) 55%,
            rgba(4, 10, 18, 0.90) 80%,
            rgba(4, 10, 18, 1.0) 95%);
        }
        .empty-row { color: var(--ink-3); font-style: italic; font-size: 13px; padding: 36px 0; justify-content: center; }
        .empty-row:hover { background: transparent; }

        .player-meta { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .avatar {
            position: relative;
            z-index: 0;
            width: 46px;
            height: 53px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--display);
            font-size: 18px;
            font-weight: 700;
            color: var(--gold-soft);
            clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
            background: linear-gradient(180deg, rgba(240, 230, 210, 0.65), rgba(120, 90, 40, 0.55));
        }
        .avatar::before {
            content: '';
            position: absolute;
            inset: 1.5px;
            z-index: -1;
            background: linear-gradient(180deg, #16242f, #0a1018);
            clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
        }
        .avatar-img {
            position: absolute;
            top: 1.5px;
            left: 1.5px;
            width: calc(100% - 3px);
            height: calc(100% - 3px);
            z-index: 1;
            object-fit: cover;
            clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
        }
        .player-name {
            font-weight: 600;
            font-size: 13.5px;
            color: var(--ink-1);
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow:
                    -1px -1px 0 #000,
                    1px -1px 0 #000,
                    -1px  1px 0 #000,
                    1px  1px 0 #000,
                    0    3px 6px rgba(0, 0, 0, 0.95);
        }
        .player-center-content {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .voice-wave {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 52px;
            opacity: 0.15;
            transition: opacity 0.3s ease, filter 0.3s ease;
        }

        .player-item.speaking .voice-wave {
            opacity: 1.0;
            filter: drop-shadow(0 0 12px rgba(10, 200, 185, 0.75));
        }

        .wave-bar {
            width: 7px;
            height: 100%;
            background-color: var(--teal);
            border-radius: 3px;
            transform: scaleY(0.12);
            transition: transform 0.2s ease;
        }

        .player-item.speaking .wave-bar:nth-child(1) { animation: wavePulse 0.5s ease-in-out infinite alternate 0.0s; }
        .player-item.speaking .wave-bar:nth-child(2) { animation: wavePulse 0.4s ease-in-out infinite alternate 0.1s; }
        .player-item.speaking .wave-bar:nth-child(3) { animation: wavePulse 0.6s ease-in-out infinite alternate 0.2s; }
        .player-item.speaking .wave-bar:nth-child(4) { animation: wavePulse 0.4s ease-in-out infinite alternate 0.05s; }
        .player-item.speaking .wave-bar:nth-child(5) { animation: wavePulse 0.7s ease-in-out infinite alternate 0.15s; }
        .player-item.speaking .wave-bar:nth-child(6) { animation: wavePulse 0.5s ease-in-out infinite alternate 0.25s; }
        .player-item.speaking .wave-bar:nth-child(7) { animation: wavePulse 0.4s ease-in-out infinite alternate 0.1s; }
        .player-item.speaking .wave-bar:nth-child(8) { animation: wavePulse 0.6s ease-in-out infinite alternate 0.2s; }
        .player-item.speaking .wave-bar:nth-child(9) { animation: wavePulse 0.5s ease-in-out infinite alternate 0.05s; }

        @keyframes wavePulse {
            0% { transform: scaleY(0.15); }
            100% { transform: scaleY(1.0); }
        }

        .you-tag {
            flex-shrink: 0;
            font-family: var(--mono);
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: #ffffff;
            background: rgba(10, 200, 185, 0.25);
            border: 1px solid var(--teal);
            box-shadow: 0 0 10px rgba(10, 200, 185, 0.35);
            padding: 2px 8px;
            border-radius: 3px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .player-status { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
        .player-status::before { content: ''; width: 6px; height: 6px; transform: rotate(45deg); background: currentColor; box-shadow: 0 0 7px currentColor; flex-shrink: 0; }
        .status-offline { color: var(--ink-3); }
        .status-connected { color: var(--teal); }
        .banned-name { text-decoration: line-through; color: var(--ink-3); }

        /* avatar lights up while the player is talking */
        .avatar { transition: filter 0.15s; }
        .player-item.speaking .avatar {
            background: linear-gradient(180deg, #3be8d8, #0a8c82);
            filter: drop-shadow(0 0 7px rgba(10, 200, 185, 0.85));
        }

        .volume-slider {
            width: 78px;
            height: 4px;
            flex-shrink: 0;
            cursor: pointer;
            accent-color: var(--gold);
        }

        button {
            cursor: pointer;
            border: none;
            color: var(--ink-1);
            font-family: inherit;
            font-weight: 600;
            transition: filter 0.15s, background 0.15s, color 0.15s, border-color 0.15s, transform 0.04s;
        }
        button:active { transform: translateY(1px); }

        .action-btn { padding: 6px 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 2px; }
        .kick-btn { color: #ffb9c1; background: rgba(232, 69, 90, 0.12); border: 1px solid rgba(232, 69, 90, 0.55); }
        .kick-btn:hover { background: rgba(232, 69, 90, 0.30); color: #fff; }
        .revoke-btn { color: #ffd98a; background: rgba(240, 178, 50, 0.10); border: 1px solid rgba(240, 178, 50, 0.50); }
        .revoke-btn:hover { background: rgba(240, 178, 50, 0.25); }
        .local-mute-btn { padding: 5px 9px; font-size: 13px; line-height: 1; background: rgba(10, 20, 34, 0.7); border: 1px solid var(--hairline); border-radius: 2px; }
        .local-mute-btn:hover { border-color: rgba(200, 170, 110, 0.5); }
        .local-mute-btn.muted { background: rgba(232, 69, 90, 0.18); border-color: rgba(232, 69, 90, 0.6); }

        .distance-badge {
            display: none;
            padding: 3px 9px;
            border-radius: 2px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--ink-2);
            background: rgba(2, 6, 12, 0.7);
            border: 1px solid var(--hairline);
        }

        .dock {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px 22px;
            padding: 14px 22px;
        }
        .pos-tracker { display: flex; flex-direction: column; gap: 4px; min-width: 185px; }
        .pt-label {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink-3);
        }
        .highlight { font-family: var(--mono); font-size: 13.5px; font-weight: 600; color: var(--ink-3); }

        .dock-center { flex: 1 1 260px; min-width: 240px; }

        .btn-primary {
            position: relative;
            z-index: 0;
            display: block;
            width: 100%;
            height: 48px;
            padding: 0 18px;
            font-family: var(--display);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-1);
            background: linear-gradient(165deg, #f0e6d2, #c8aa6e 30%, #785a28 78%, #c8aa6e);
            clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px),
                calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
            filter: drop-shadow(0 4px 14px rgba(200, 170, 110, 0.18));
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 1.5px;
            z-index: -1;
            background: linear-gradient(180deg, #13253a, #0a1523);
            clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px),
                calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px);
            transition: background 0.15s;
        }
        .btn-primary:hover { filter: drop-shadow(0 4px 18px rgba(200, 170, 110, 0.38)); }
        .btn-primary:hover::before { background: linear-gradient(180deg, #1b3349, #0e1d30); }
        .btn-primary.is-waiting {
            color: #ffd98a;
            background: linear-gradient(165deg, #ffd98a, #f0b232 30%, #8a5a14 78%, #f0b232);
            filter: drop-shadow(0 4px 14px rgba(240, 178, 50, 0.22));
        }
        .btn-primary.is-waiting::before {
            background:
                repeating-linear-gradient(-45deg, rgba(240, 178, 50, 0.08) 0 8px, transparent 8px 16px),
                linear-gradient(180deg, #1d1708, #120e05);
            animation: march 1.2s linear infinite;
        }
        @keyframes march { to { background-position: 22.6px 0, 0 0; } }

        .controls-row { display: none; gap: 10px; }
        .btn-control {
            flex: 1;
            height: 48px;
            padding: 0 12px;
            font-size: 13px;
            letter-spacing: 0.03em;
            color: var(--ink-1);
            background: rgba(10, 20, 34, 0.8);
            border: 1px solid var(--hairline);
            border-radius: 2px;
        }
        .btn-control:hover { border-color: rgba(200, 170, 110, 0.5); background: rgba(19, 32, 50, 0.9); }
        .btn-control.active {
            color: #ffccd2;
            background: linear-gradient(180deg, rgba(232, 69, 90, 0.22), rgba(232, 69, 90, 0.10));
            border-color: rgba(232, 69, 90, 0.65);
        }

        .settings-panel {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            border-radius: 2px;
            background: rgba(3, 9, 16, 0.5);
            border: 1px solid var(--hairline);
        }
        .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .s-title { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; font-weight: 600; }
        .setting-hint { font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--ink-3); }

        .switch { position: relative; display: inline-block; width: 42px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-track {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #18232f;
            border: 1px solid var(--hairline);
            border-radius: 2px;
            transition: 0.2s;
        }
        .slider-track:before {
            content: "";
            position: absolute;
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background: #8c95a8;
            border-radius: 1px;
            transition: 0.2s;
        }
        .switch input:checked + .slider-track { background: linear-gradient(180deg, #b89a5e, #785a28); border-color: rgba(240, 230, 210, 0.45); }
        .switch input:checked + .slider-track:before { transform: translateX(20px); background: #f0e6d2; }

        @media (max-width: 840px) {
            body { overflow: auto; }
            #main-ui { height: auto; min-height: 100vh; }
            .squad-panel { min-height: 340px; }
            .dock { align-items: stretch; flex-direction: column; }
            .pos-tracker { flex-direction: row; align-items: baseline; justify-content: space-between; }
            .settings-panel { width: 100%; }
            .settings-panel .setting-row { width: 100%; }
        }
    </style>
</head>
<body>

<div id="main-ui">
    <header class="panel command-bar">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 40 44" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="rim-gold" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#f0e6d2"/>
                            <stop offset="1" stop-color="#785a28"/>
                        </linearGradient>
                        <linearGradient id="core-teal" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#0ac8b9"/>
                            <stop offset="1" stop-color="#005a82"/>
                        </linearGradient>
                    </defs>
                    <path d="M20 1.5 37.5 11.6v20.8L20 42.5 2.5 32.4V11.6Z" fill="rgba(5, 12, 22, 0.9)" stroke="url(#rim-gold)" stroke-width="1.5"/>
                    <path d="M20 9.5 29.5 22 20 34.5 10.5 22Z" fill="url(#core-teal)"/>
                    <path d="M20 15 25 22l-5 7-5-7Z" fill="#02060c" opacity="0.5"/>
                </svg>
            </div>
            <div>
                <h1>League Proximity Chat</h1>
                <p>https://github.com/bedwarshurts/LeagueProximityChat</p>
            </div>
        </div>
        <div class="hud-status">
            <div id="ws-status" class="status error">Position Tracker: Disconnected</div>
            <div id="lk-status" class="status error">Audio Server: Waiting for token...</div>
        </div>
    </header>

    <main class="panel squad-panel">
        <div class="roster-head">
            <span class="section-label">Match Roster</span>
            <span class="roster-count" id="roster-count">-</span>
        </div>
        <div id="roster-container">
            <div class="player-item empty-row">Waiting for match to begin…</div>
        </div>
    </main>

    <footer class="panel dock">
        <div class="pos-tracker">
            <span class="pt-label">Your Position</span>
            <span id="local-coords" class="highlight">Waiting for data...</span>
        </div>

        <div class="dock-center">
            <button id="start-btn" class="btn-primary">Connect to Audio</button>
            <div id="voice-controls" class="controls-row">
                <button id="mute-btn" class="btn-control btn-mute">🎤 Mute</button>
                <button id="deafen-btn" class="btn-control btn-deafen">🎧 Deafen</button>
            </div>
        </div>

        <div class="settings-panel">
            <div class="setting-row">
                <span class="s-title">
                    Noise Cancellation
                    <span class="setting-hint">Krisp <span id="krisp-status"></span></span>
                </span>
                <label class="switch">
                    <input type="checkbox" id="krisp-toggle">
                    <span class="slider-track"></span>
                </label>
            </div>
        </div>
    </footer>
</div>

<div id="hidden-audio-container" style="display: none;"></div>

<script>
    const LIVEKIT_URL = 'https://league-proximity-chat-3q7it5ix.livekit.cloud';

    const PROFILE_ICON_URL = (id) => `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/${id}.jpg`;
    const SPLASH_URL = (champ, skin) => `https://ddragon.leagueoflegends.com/cdn/img/champion/centered/${champ}_${skin}.jpg`;
    const CHAMP_NAME_FIXES = { FiddleSticks: 'Fiddlesticks' };

    const ddragonVersionPromise = fetch('https://ddragon.leagueoflegends.com/api/versions.json')
        .then(r => r.json())
        .then(v => v[0])
        .catch(() => null);

    let champSummaryPromise = null;
    function getChampionIdByAlias(alias) {
        if (!champSummaryPromise) {
            champSummaryPromise = fetch('https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-summary.json')
                .then(r => r.json())
                .catch(() => null);
        }
        return champSummaryPromise.then(list => {
            if (!list) return null;
            const hit = list.find(c => c.alias && c.alias.toLowerCase() === alias.toLowerCase());
            return hit ? hit.id : null;
        });
    }

    const champSkinDataCache = {};
    async function resolveSkinNum(champ, skinId) {
        if (!skinId) return 0;
        try {
            const champId = await getChampionIdByAlias(champ);
            if (!champId) return skinId;
            if (!champSkinDataCache[champ]) {
                champSkinDataCache[champ] = fetch(`https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champions/${champId}.json`)
                    .then(r => r.json())
                    .then(d => {
                        const skinNums = [];
                        const chromaToParent = {};
                        (d.skins || []).forEach(s => {
                            const num = s.id - champId * 1000;
                            skinNums.push(num);
                            (s.chromas || []).forEach(c => { chromaToParent[c.id - champId * 1000] = num; });
                        });
                        return { skinNums, chromaToParent };
                    });
            }
            const { skinNums, chromaToParent } = await champSkinDataCache[champ];
            if (chromaToParent[skinId] !== undefined) return chromaToParent[skinId];
            if (skinNums.includes(skinId)) return skinId;
            return skinId;
        } catch (e) {
            return skinId;
        }
    }

    let room = null;
    let audioCtx;
    let masterLimiter = null;
    const remoteAudioNodes = {};
    const remotePositions = {};
    const localPosition = {x: 0, y: 0, isDead: false};

    let micMuted = false;
    let isDeafened = false;
    let micMutedBeforeDeafen = false;
    let masterGain = null;
    let krispProcessor = null;
    let krispEnabled = localStorage.getItem('krispEnabled') !== 'false';
    const locallyMuted = new Set();
    const playerVolumes = (() => {
        try { return JSON.parse(localStorage.getItem('playerVolumes')) || {}; } catch (e) { return {}; }
    })();
    let connected = false;
    let isWaitingForMatch = false;
    let trackerSocket = null;
    let localUserIdentity = null;
    let matchLeaderIdentity = null;
    let isReplaced = false;

    connectToLocalJavaTracker();

    function closeApplicationTab() {
        try { if (room) room.disconnect(); } catch (e) {}

        document.body.innerHTML = `
            <div style="display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px;">
                <div style="background:linear-gradient(180deg,#0c1626,#060d17); border:1px solid rgba(200,170,110,0.35); border-radius:3px; box-shadow:0 18px 50px -12px rgba(0,0,0,0.7); padding:38px; max-width:420px; width:100%; text-align:center;">
                    <div style="width:54px; height:54px; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; font-size:24px; border-radius:3px; color:#f0e6d2; background:linear-gradient(135deg,#e8455a,#8e1f2c); box-shadow:0 8px 22px -6px rgba(232,69,90,0.45);">⏻</div>
                    <h2 style="margin:0 0 8px; font-family:Cinzel,serif; letter-spacing:0.08em; font-size:18px; color:#f0e6d2;">Application Closed</h2>
                    <p style="margin:0 0 22px; color:#a8a290; font-size:14px; line-height:1.5;">LeagueProximityChat has shut down and your microphone is disconnected.</p>
                    <p style="margin:0; font-size:12.5px; color:#6b7585; line-height:1.55;">
                        Your browser won't let this tab close itself -<br>
                        <strong style="color:#a8a290;">you can safely close this window.</strong>
                    </p>
                </div>
            </div>
        `;

        setTimeout(() => {
            window.open('', '_self', '');
            window.close();
        }, 100);
    }

    function resetToIdleState() {
        if (window.voiceInterval) { clearInterval(window.voiceInterval); window.voiceInterval = null; }

        try { if (room) room.disconnect(); } catch (e) {}

        Object.keys(remoteAudioNodes).forEach(cleanupRemoteAudio);
        localPosition.x = 0;
        localPosition.y = 0;
        localPosition.isDead = false;

        isWaitingForMatch = false;
        connected = false;
        micMuted = false;
        isDeafened = false;
        micMutedBeforeDeafen = false;
        krispProcessor = null;
        locallyMuted.clear();
        if (masterGain && audioCtx) masterGain.gain.setTargetAtTime(1, audioCtx.currentTime, 0.05);

        const startBtn = document.getElementById('start-btn');
        startBtn.style.display = 'block';
        startBtn.classList.remove('is-waiting');
        startBtn.innerText = 'Connect to Audio';
        showVoiceControls(false);
        updateVoiceButtonsUI();
        setKrispStatus(krispEnabled ? '(applies on connect)' : '(off)');

        const lkStatus = document.getElementById('lk-status');
        lkStatus.className = 'status error';
        lkStatus.innerText = 'Audio Server: Waiting for token...';

        localUserIdentity = null;
        matchLeaderIdentity = null;
        document.getElementById('roster-container').innerHTML =
            '<div class="player-item empty-row">Waiting for match to begin…</div>';
        document.getElementById('roster-count').innerText = '-';

        const coordEl = document.getElementById('local-coords');
        if (coordEl) {
            coordEl.innerText = "Waiting for data...";
            coordEl.style.color = "#6b7585";
        }
    }

    function buildRosterUI(players, localId, leaderId) {
        localUserIdentity = localId;
        matchLeaderIdentity = leaderId;
        const container = document.getElementById('roster-container');
        container.innerHTML = '';

        const isAdmin = localUserIdentity &&
            ["only forward#star", "stab enchanters#star"].includes(localUserIdentity.toLowerCase());

        players.forEach(player => {
            const div = document.createElement('div');
            div.className = 'player-item';
            div.id = `roster-${player.identity}`;

            if (player.champion && player.champion !== 'Unknown') {
                const champ = CHAMP_NAME_FIXES[player.champion] || player.champion;
                const splash = document.createElement('div');
                splash.className = 'player-splash';
                div.appendChild(splash);

                const trySplash = (skin) => {
                    const url = SPLASH_URL(champ, skin);
                    const probe = new Image();
                    probe.onload = () => {
                        splash.style.backgroundImage = `url("${url}")`;
                        div.classList.add('has-splash');
                    };
                    probe.onerror = () => { if (skin !== 0) trySplash(0); };
                    probe.src = url;
                };
                resolveSkinNum(champ, Number(player.skinId) || 0).then(trySplash);
            }

            const meta = document.createElement('div');
            meta.className = 'player-meta';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            const initialMatch = (player.name || player.identity || '?').match(/[A-Za-z0-9]/);
            avatar.innerText = initialMatch ? initialMatch[0].toUpperCase() : '?';
            const hasIconData = typeof player.profileIconData === 'string' && player.profileIconData.startsWith('data:');

            if (hasIconData || player.profileIconId > 0) {
                const icon = document.createElement('img');
                icon.className = 'avatar-img';
                icon.alt = '';
                const sources = [];
                if (hasIconData) sources.push(player.profileIconData);
                if (player.profileIconId > 0) {
                    sources.push(`/profile-icon/${player.profileIconId}`, PROFILE_ICON_URL(player.profileIconId));
                }
                let attempt = 0;
                let ddragonAdded = false;
                icon.onerror = async () => {
                    if (!ddragonAdded && player.profileIconId > 0) {
                        const ver = await ddragonVersionPromise;
                        if (ver) {
                            ddragonAdded = true;
                            sources.push(`https://ddragon.leagueoflegends.com/cdn/${ver}/img/profileicon/${player.profileIconId}.png`);
                        }
                    }
                    attempt++;
                    if (attempt < sources.length) {
                        icon.src = sources[attempt];
                    } else {
                        console.warn(`[Icon] Could not load profile icon ${player.profileIconId} for ${player.identity} from any source`);
                        icon.remove();
                    }
                };
                icon.src = sources[0];
                avatar.appendChild(icon);
            } else {
                console.warn(`[Icon] No profile icon id received for ${player.identity} (got ${player.profileIconId})`);
            }
            meta.appendChild(avatar);

            const nameSpan = document.createElement('span');
            nameSpan.className = 'player-name';

            if (player.identity === matchLeaderIdentity) {
                nameSpan.innerText = `👑 ${player.name}`;
            } else {
                nameSpan.innerText = player.name;
            }
            meta.appendChild(nameSpan);

            if (player.identity === localUserIdentity) {
                const youTag = document.createElement('span');
                youTag.className = 'you-tag';
                youTag.innerText = 'YOU';
                meta.appendChild(youTag);
            }

            const centerDiv = document.createElement('div');
            centerDiv.className = 'player-center-content';
            centerDiv.innerHTML = `
                <div class="voice-wave">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
            `;

            const controlsContainer = document.createElement('div');
            controlsContainer.style.display = 'flex';
            controlsContainer.style.alignItems = 'center';
            controlsContainer.style.gap = '10px';

            if (player.identity !== localUserIdentity && isAdmin) {
                const distSpan = document.createElement('span');
                distSpan.className = 'distance-badge';
                distSpan.id = `dist-${player.identity}`;
                distSpan.innerText = "0.0m";
                controlsContainer.appendChild(distSpan);
            }

            const statusSpan = document.createElement('span');
            statusSpan.className = 'player-status status-offline';
            statusSpan.id = `status-${player.identity}`;
            statusSpan.innerText = "Not Connected";

            controlsContainer.appendChild(statusSpan);

            if (player.identity !== localUserIdentity) {
                const volSlider = document.createElement('input');
                volSlider.type = 'range';
                volSlider.className = 'volume-slider';
                volSlider.min = '0';
                volSlider.max = '2';
                volSlider.step = '0.05';
                volSlider.value = playerVolumes[player.identity] ?? 1;
                volSlider.title = `Volume: ${Math.round(volSlider.value * 100)}%`;
                volSlider.oninput = () => {
                    playerVolumes[player.identity] = Number(volSlider.value);
                    localStorage.setItem('playerVolumes', JSON.stringify(playerVolumes));
                    volSlider.title = `Volume: ${Math.round(volSlider.value * 100)}%`;
                    updateRemoteAudio(player.identity);
                };
                controlsContainer.appendChild(volSlider);
            }

            if (player.identity !== localUserIdentity) {
                const localMuteBtn = document.createElement('button');
                const muted = locallyMuted.has(player.identity);
                localMuteBtn.className = 'action-btn local-mute-btn' + (muted ? ' muted' : '');
                localMuteBtn.id = `localmute-${player.identity}`;
                localMuteBtn.innerText = muted ? '🔇' : '🔊';
                localMuteBtn.title = muted ? 'Unmute (for you only)' : 'Mute (for you only)';
                localMuteBtn.onclick = () => toggleLocalMute(player.identity);
                controlsContainer.appendChild(localMuteBtn);
            }

            if (localUserIdentity === matchLeaderIdentity && player.identity !== localUserIdentity) {
                const actionBtn = document.createElement('button');
                actionBtn.className = 'action-btn kick-btn';
                actionBtn.id = `action-${player.identity}`;
                actionBtn.innerText = 'Kick';
                actionBtn.style.display = 'none';
                actionBtn.onclick = () => handleModerationAction(player.identity, player.name);
                controlsContainer.appendChild(actionBtn);
            }

            div.appendChild(meta);
            div.appendChild(centerDiv);
            div.appendChild(controlsContainer);

            container.appendChild(div);
        });

        document.getElementById('roster-count').innerText = players.length;
    }

    function handleModerationAction(identity, name) {
        const btn = document.getElementById(`action-${identity}`);
        if (!btn || !trackerSocket) return;

        if (btn.innerText === 'Kick') {
            trackerSocket.send(JSON.stringify({type: "KICK_USER", identity: identity, name: name}));
        } else {
            trackerSocket.send(JSON.stringify({type: "REVOKE_BAN", identity: identity, name: name}));
        }
    }

    function updatePlayerStatus(identity, statusText, cssClass) {
        const statusSpan = document.getElementById(`status-${identity}`);
        if (statusSpan) {
            statusSpan.innerText = statusText;
            statusSpan.className = `player-status ${cssClass}`;
        }

        const actionBtn = document.getElementById(`action-${identity}`);
        if (actionBtn) {
            if (statusText === "Connected" || statusText === "Banned") {
                actionBtn.style.display = 'block';
            } else {
                actionBtn.style.display = 'none';
            }
        }

        const distSpan = document.getElementById(`dist-${identity}`);
        if (distSpan) {
            distSpan.style.display = (statusText === "Connected") ? 'inline-block' : 'none';
        }
    }

    function getMasterLimiter() {
        if (!audioCtx) return null;
        if (!masterLimiter) {
            masterLimiter = audioCtx.createDynamicsCompressor();
            masterLimiter.threshold.value = -6;
            masterLimiter.knee.value = 0;
            masterLimiter.ratio.value = 20;
            masterLimiter.attack.value = 0.003;
            masterLimiter.release.value = 0.25;
            masterGain = audioCtx.createGain();
            masterGain.gain.value = isDeafened ? 0 : 1;
            masterLimiter.connect(masterGain);
            masterGain.connect(audioCtx.destination);
        }
        return masterLimiter;
    }

    function updateListenerPosition() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        audioCtx.listener.positionX.setTargetAtTime(localPosition.x, now, 0.1);
        audioCtx.listener.positionY.setTargetAtTime(0, now, 0.1);
        audioCtx.listener.positionZ.setTargetAtTime(localPosition.y, now, 0.1);
    }

    function updateRemoteAudio(identity) {
        if (!audioCtx) return;
        const nodeData = remoteAudioNodes[identity];
        const remotePos = remotePositions[identity];
        if (!nodeData || !remotePos) return;

        const distance = Math.hypot(remotePos.x - localPosition.x, remotePos.y - localPosition.y);

        const maxDist = 11;
        const fullDist = 3.0;
        const maxVolume = 2.0;
        const falloffExp = 0.6;

        let volume;
        if (distance >= maxDist) {
            volume = 0;
        } else if (distance <= fullDist) {
            volume = maxVolume;
        } else {
            const t = (distance - fullDist) / (maxDist - fullDist);
            volume = maxVolume * Math.pow(1 - t, falloffExp);
        }
        volume *= playerVolumes[identity] ?? 1;
        if (remotePos.isDead) volume = 0;
        if (locallyMuted.has(identity)) volume = 0;

        const now = audioCtx.currentTime;
        nodeData.panner.positionX.setTargetAtTime(remotePos.x, now, 0.1);
        nodeData.panner.positionY.setTargetAtTime(0, now, 0.1);
        nodeData.panner.positionZ.setTargetAtTime(remotePos.y, now, 0.1);
        nodeData.gain.gain.setTargetAtTime(volume, now, 0.1);

        const distSpan = document.getElementById(`dist-${identity}`);
        if (distSpan) {
            if (remotePos.isDead) {
                distSpan.innerText = "DEAD";
                distSpan.style.color = "#e8455a";
            } else {
                distSpan.innerText = `${distance.toFixed(1)}m`;
                distSpan.style.color = (distance <= maxDist) ? "#0ac8b9" : "#6b7585";
            }
        }
    }

    function cleanupRemoteAudio(identity) {
        const nodeData = remoteAudioNodes[identity];
        if (!nodeData) return;
        try {
            nodeData.source.disconnect();
            nodeData.panner.disconnect();
            nodeData.gain.disconnect();
            if (nodeData.hiddenElement) nodeData.hiddenElement.remove();
        } catch (e) {}
        delete remoteAudioNodes[identity];
        delete remotePositions[identity];

        const distSpan = document.getElementById(`dist-${identity}`);
        if (distSpan) distSpan.innerText = "0.0m";
    }

    async function ensurePlaybackUnlocked() {
        try {
            if (room && typeof room.canPlaybackAudio === 'boolean' && !room.canPlaybackAudio) await room.startAudio();
        } catch (e) {}
    }

    document.getElementById('start-btn').addEventListener('click', async () => {
        if (connected || !trackerSocket || trackerSocket.readyState !== WebSocket.OPEN) return;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        try { await audioCtx.resume(); } catch (e) {}

        const btn = document.getElementById('start-btn');
        if (!isWaitingForMatch) {
            isWaitingForMatch = true;
            btn.classList.add('is-waiting');
            btn.innerText = 'Waiting for match… (click to cancel)';
            trackerSocket.send("REQUEST_JOIN");
        } else {
            isWaitingForMatch = false;
            btn.classList.remove('is-waiting');
            btn.innerText = 'Connect to Audio';
            trackerSocket.send("CANCEL_JOIN");
        }
    });

    function showVoiceControls(visible) {
        document.getElementById('voice-controls').style.display = visible ? 'flex' : 'none';
    }

    function updateVoiceButtonsUI() {
        const muteBtn = document.getElementById('mute-btn');
        muteBtn.innerText = micMuted ? '🎤 Unmute' : '🎤 Mute';
        muteBtn.classList.toggle('active', micMuted);

        const deafenBtn = document.getElementById('deafen-btn');
        deafenBtn.innerText = isDeafened ? '🎧 Undeafen' : '🎧 Deafen';
        deafenBtn.classList.toggle('active', isDeafened);
    }

    async function setMicMuted(muted) {
        micMuted = muted;
        try { if (room) await room.localParticipant.setMicrophoneEnabled(!muted); } catch (e) {}
        updateVoiceButtonsUI();
    }

    async function setDeafened(deafened) {
        isDeafened = deafened;
        if (masterGain && audioCtx) {
            masterGain.gain.setTargetAtTime(deafened ? 0 : 1, audioCtx.currentTime, 0.05);
        }

        if (deafened) {
            micMutedBeforeDeafen = micMuted;
            await setMicMuted(true);
        } else {
            await setMicMuted(micMutedBeforeDeafen);
        }
    }

    document.getElementById('mute-btn').addEventListener('click', async () => {
        if (!connected || !room) return;
        if (isDeafened) {
            micMutedBeforeDeafen = false;
            await setDeafened(false);
            return;
        }
        await setMicMuted(!micMuted);
    });

    document.getElementById('deafen-btn').addEventListener('click', async () => {
        if (!connected || !room) return;
        await setDeafened(!isDeafened);
    });

    function toggleLocalMute(identity) {
        if (locallyMuted.has(identity)) {
            locallyMuted.delete(identity);
        } else {
            locallyMuted.add(identity);
        }

        const btn = document.getElementById(`localmute-${identity}`);
        if (btn) {
            const muted = locallyMuted.has(identity);
            btn.innerText = muted ? '🔇' : '🔊';
            btn.classList.toggle('muted', muted);
            btn.title = muted ? 'Unmute (for you only)' : 'Mute (for you only)';
        }

        const nodeData = remoteAudioNodes[identity];
        if (nodeData && audioCtx) {
            if (locallyMuted.has(identity)) {
                nodeData.gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
            } else {
                updateRemoteAudio(identity);
            }
        }
    }

    function setKrispStatus(text) {
        const el = document.getElementById('krisp-status');
        if (el) el.innerText = text;
    }

    async function applyKrispState() {
        localStorage.setItem('krispEnabled', krispEnabled);

        if (!connected || !room) {
            setKrispStatus(krispEnabled ? '(applies on connect)' : '(off)');
            return;
        }

        try {
            const audioPublications = Array.from(room.localParticipant.audioTrackPublications.values());
            const track = (audioPublications.length > 0) ? audioPublications[0].track : null;
            if (!track) {
                console.warn('[Krisp] No local audio track found - noise cancellation not applied.');
                setKrispStatus('(no mic track)');
                return;
            }

            if (krispEnabled) {
                if (krispProcessor && typeof krispProcessor.setEnabled === 'function') {
                    await krispProcessor.setEnabled(true);
                } else if (!krispProcessor) {
                    const {
                        KrispNoiseFilter,
                        isKrispNoiseFilterSupported
                    } = await import('https://cdn.jsdelivr.net/npm/@livekit/krisp-noise-filter/+esm');
                    if (!isKrispNoiseFilterSupported()) {
                        console.warn('[Krisp] Not supported in this browser - noise cancellation disabled.');
                        setKrispStatus('(unsupported)');
                        return;
                    }
                    krispProcessor = KrispNoiseFilter();
                    await track.setProcessor(krispProcessor);
                }
                console.log('[Krisp] Noise cancellation active.');
                setKrispStatus('(active)');
            } else {
                if (krispProcessor) {
                    if (typeof krispProcessor.setEnabled === 'function') {
                        await krispProcessor.setEnabled(false);
                    } else {
                        await track.stopProcessor();
                        krispProcessor = null;
                    }
                }
                console.log('[Krisp] Noise cancellation off.');
                setKrispStatus('(off)');
            }
        } catch (e) {
            console.error('[Krisp] Failed to update noise filter:', e);
            setKrispStatus('(error)');
        }
    }

    const krispToggle = document.getElementById('krisp-toggle');
    krispToggle.checked = krispEnabled;
    setKrispStatus(krispEnabled ? '(applies on connect)' : '(off)');
    krispToggle.addEventListener('change', async () => {
        krispEnabled = krispToggle.checked;
        await applyKrispState();
    });

    function reportPlayerStateToJava(type, participant) {
        if (trackerSocket && trackerSocket.readyState === WebSocket.OPEN) {
            trackerSocket.send(JSON.stringify({
                type: type,
                identity: participant.identity,
                name: participant.name || "Unknown"
            }));
        }
    }

    function connectToLocalJavaTracker() {
        if (trackerSocket && trackerSocket.readyState === WebSocket.OPEN) return;

        isReplaced = false;

        trackerSocket = new WebSocket('ws://localhost:8887');
        trackerSocket.onopen = () => {
            document.getElementById('ws-status').className = 'status success';
            document.getElementById('ws-status').innerText = 'Position Tracker: Connected';
        };

        trackerSocket.onmessage = (event) => {
            try {
                if (event.data === "REQUEST_JOIN" || event.data === "CANCEL_JOIN") return;
                const data = JSON.parse(event.data);

                if (data.type === "REPLACED") {
                    isReplaced = true;
                    return;
                }

                if (data.type === "SHUTDOWN") {
                    closeApplicationTab();
                    return;
                }

                if (data.type === "GAME_ENDED") {
                    resetToIdleState();
                    return;
                }

                if (data.type === "TOGGLE_MUTE") {
                    document.getElementById('mute-btn').click();
                    return;
                }

                if (data.type === "TOGGLE_DEAFEN") {
                    document.getElementById('deafen-btn').click();
                    return;
                }

                if (data.type === "MATCH_ROSTER") {
                    buildRosterUI(data.players, data.localIdentity, data.roomLeader);
                    return;
                }

                if (data.type === "CONNECT_LIVEKIT") {
                    connectToLiveKit(data.token);
                    return;
                }

                if (data.type === "PLAYER_BANNED") {
                    const row = document.getElementById(`roster-${data.identity}`);
                    if (row) {
                        const nameSpan = row.querySelector('.player-name');
                        if (nameSpan) nameSpan.classList.add('banned-name');
                    }

                    const btn = document.getElementById(`action-${data.identity}`);
                    if (btn) {
                        btn.className = 'action-btn revoke-btn';
                        btn.innerText = 'Revoke Ban';
                    }

                    updatePlayerStatus(data.identity, "Banned", "status-offline");
                    return;
                }

                if (data.type === "PLAYER_UNBANNED") {
                    const row = document.getElementById(`roster-${data.identity}`);
                    if (row) {
                        const nameSpan = row.querySelector('.player-name');
                        if (nameSpan) nameSpan.classList.remove('banned-name');
                    }

                    const btn = document.getElementById(`action-${data.identity}`);
                    if (btn) {
                        btn.className = 'action-btn kick-btn';
                        btn.innerText = 'Kick';
                    }

                    updatePlayerStatus(data.identity, "Not Connected", "status-offline");
                    return;
                }

                if (data.x !== undefined && data.y !== undefined) {
                    localPosition.x = Number(data.x);
                    localPosition.y = Number(data.y);
                    localPosition.isDead = Boolean(data.isDead);

                    const coordEl = document.getElementById('local-coords');
                    if (coordEl) {
                        coordEl.innerText = `X: ${localPosition.x.toFixed(1)}, Y: ${localPosition.y.toFixed(1)}`;
                        if (localPosition.isDead) {
                            coordEl.innerText += " (DEAD)";
                            coordEl.style.color = "#e8455a";
                        } else {
                            coordEl.style.color = "#0ac8b9";
                        }
                    }

                    updateListenerPosition();

                    if (room && room.state === LivekitClient.ConnectionState.Connected) {
                        const payload = new TextEncoder().encode(JSON.stringify({
                            x: localPosition.x,
                            y: localPosition.y,
                            isDead: localPosition.isDead
                        }));
                        room.localParticipant.publishData(payload, LivekitClient.DataPacket_Kind.LOSSY);
                    }
                }
            } catch (e) {}
        };

        trackerSocket.onclose = () => {
            trackerSocket = null;

            if (isReplaced) {
                document.getElementById('ws-status').className = 'status error';
                document.getElementById('ws-status').innerText = 'Connection yielded to a newer tab.';
                return;
            }

            document.getElementById('ws-status').className = 'status error';
            document.getElementById('ws-status').innerText = 'Position Tracker: Disconnected';

            document.getElementById('local-coords').innerText = "Waiting for data...";
            document.getElementById('local-coords').style.color = "#6b7585";

            setTimeout(connectToLocalJavaTracker, 2000);
        };
    }

    function initializeFreshRoom() {
        if (room) {
            room.removeAllListeners();
            try { room.disconnect(); } catch (e) {}
        }

        room = new LivekitClient.Room({
            adaptiveStream: true,
            dynacast: true,
            audioCaptureDefaults: {
                echoCancellation: false,
                noiseSuppression: false,
                voiceIsolation: false,
                autoGainControl: false
            }
        });

        room.on(LivekitClient.RoomEvent.AudioPlaybackStatusChanged, async () => {
            await ensurePlaybackUnlocked();
        });

        room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
            const speaking = new Set(speakers.map(p => p.identity));
            document.querySelectorAll('.player-item[id^="roster-"]').forEach(row => {
                row.classList.toggle('speaking', speaking.has(row.id.slice('roster-'.length)));
            });
        });

        room.on(LivekitClient.RoomEvent.Disconnected, () => {
            if (window.voiceInterval) { clearInterval(window.voiceInterval); window.voiceInterval = null; }

            document.querySelectorAll('.player-item.speaking').forEach(row => row.classList.remove('speaking'));

            document.getElementById('lk-status').className = 'status error';
            document.getElementById('lk-status').innerText = 'Audio Server: Disconnected - ready to retry.';

            const sb = document.getElementById('start-btn');
            sb.style.display = 'block';
            sb.classList.remove('is-waiting');
            sb.innerText = 'Connect to Audio';
            showVoiceControls(false);

            connected = false;
            isWaitingForMatch = false;
            krispProcessor = null;
            setKrispStatus(krispEnabled ? '(applies on connect)' : '(off)');

            if (localUserIdentity) {
                updatePlayerStatus(localUserIdentity, "Not Connected", "status-offline");
            }

            if (trackerSocket && trackerSocket.readyState === WebSocket.OPEN) {
                trackerSocket.send("CANCEL_JOIN");
            }
        });

        room.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
            reportPlayerStateToJava("PLAYER_JOINED", participant);
            updatePlayerStatus(participant.identity, "Connected", "status-connected");
        });

        room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
            cleanupRemoteAudio(participant.identity);
            reportPlayerStateToJava("PLAYER_LEFT", participant);

            const statusSpan = document.getElementById(`status-${participant.identity}`);
            if (statusSpan && statusSpan.innerText !== "Banned") {
                updatePlayerStatus(participant.identity, "Not Connected", "status-offline");
            }
        });

        room.on(LivekitClient.RoomEvent.TrackSubscribed, async (track, publication, participant) => {
            if (track.kind !== 'audio') return;
            const hiddenElement = track.attach();
            hiddenElement.volume = 0;
            document.getElementById('hidden-audio-container').appendChild(hiddenElement);
            const mediaStream = new MediaStream([track.mediaStreamTrack]);
            const source = audioCtx.createMediaStreamSource(mediaStream);
            const panner = audioCtx.createPanner();
            const gain = audioCtx.createGain();
            panner.panningModel = 'HRTF';
            panner.distanceModel = 'linear';
            panner.refDistance = 100;
            panner.maxDistance = 100000;
            panner.rolloffFactor = 0;
            panner.coneInnerAngle = 360;
            source.connect(panner);
            panner.connect(gain);
            gain.connect(getMasterLimiter() || audioCtx.destination);
            remoteAudioNodes[participant.identity] = {source, panner, gain, hiddenElement};
            await ensurePlaybackUnlocked();
            updateRemoteAudio(participant.identity);
        });

        room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
            cleanupRemoteAudio(participant.identity);
        });

        room.on(LivekitClient.RoomEvent.DataReceived, (payload, participant) => {
            const decoded = new TextDecoder().decode(payload);
            try {
                const data = JSON.parse(decoded);
                remotePositions[participant.identity] = {
                    x: Number(data.x),
                    y: Number(data.y),
                    isDead: Boolean(data.isDead)
                };
                updateRemoteAudio(participant.identity);
            } catch (e) {}
        });

        if (window.voiceInterval) clearInterval(window.voiceInterval);

        let localAnalyser = null;
        let localDataArray = null;

        window.voiceInterval = setInterval(() => {
            if (!room || !connected) return;

            if (room.localParticipant) {
                let isTalkingLocally = room.localParticipant.isSpeaking;

                if (!isTalkingLocally && audioCtx && !micMuted) {
                    const pubs = Array.from(room.localParticipant.audioTrackPublications.values());
                    if (pubs.length > 0 && pubs[0].track && pubs[0].track.mediaStreamTrack) {
                        try {
                            if (!localAnalyser) {
                                const stream = new MediaStream([pubs[0].track.mediaStreamTrack]);
                                const source = audioCtx.createMediaStreamSource(stream);
                                localAnalyser = audioCtx.createAnalyser();
                                localAnalyser.fftSize = 256;
                                source.connect(localAnalyser);
                                localDataArray = new Uint8Array(localAnalyser.frequencyBinCount);
                            }
                            localAnalyser.getByteFrequencyData(localDataArray);

                            let sum = 0;
                            for (let i = 0; i < localDataArray.length; i++) sum += localDataArray[i];
                            let avgVolume = sum / localDataArray.length;

                            if (avgVolume > 8) isTalkingLocally = true;
                        } catch (e) {}
                    }
                }

                if (micMuted || isDeafened) isTalkingLocally = false;

                const localRow = document.getElementById(`roster-${room.localParticipant.identity}`);
                if (localRow) {
                    if (isTalkingLocally) localRow.classList.add('speaking');
                    else localRow.classList.remove('speaking');
                }
            }

            room.remoteParticipants.forEach((participant) => {
                const playerRow = document.getElementById(`roster-${participant.identity}`);
                if (playerRow) {
                    let isAudible = false;

                    if (participant.isSpeaking && !locallyMuted.has(participant.identity) && !isDeafened) {

                        const remotePos = remotePositions[participant.identity];
                        if (remotePos) {
                            const distance = Math.hypot(remotePos.x - localPosition.x, remotePos.y - localPosition.y);

                            if (distance < 12.2 && !remotePos.isDead && !localPosition.isDead) {
                                isAudible = true;
                            }
                        }
                    }

                    if (isAudible) {
                        playerRow.classList.add('speaking');
                    } else {
                        playerRow.classList.remove('speaking');
                    }
                }
            });
        }, 80);
    }

    async function connectToLiveKit(token) {
        try {
            const statusEl = document.getElementById('lk-status');
            statusEl.className = 'status loading';
            statusEl.innerText = 'Audio Server: Connecting…';

            initializeFreshRoom();

            await room.connect(LIVEKIT_URL, token);
            connected = true;

            room.remoteParticipants.forEach((participant) => {
                reportPlayerStateToJava("PLAYER_JOINED", participant);
                updatePlayerStatus(participant.identity, "Connected", "status-connected");
            });

            reportPlayerStateToJava("PLAYER_JOINED", room.localParticipant);

            statusEl.className = 'status success';
            statusEl.innerText = 'Audio Server: Connected';
            document.getElementById('start-btn').style.display = 'none';

            micMuted = false;
            isDeafened = false;
            micMutedBeforeDeafen = false;
            if (masterGain && audioCtx) masterGain.gain.setTargetAtTime(1, audioCtx.currentTime, 0.05);
            updateVoiceButtonsUI();
            showVoiceControls(true);

            if (localUserIdentity) updatePlayerStatus(localUserIdentity, "Connected", "status-connected");

            await ensurePlaybackUnlocked();
            await room.localParticipant.setMicrophoneEnabled(true);

            await applyKrispState();
            return true;

        } catch (error) {
            document.getElementById('lk-status').className = 'status error';
            document.getElementById('lk-status').innerText = 'Audio Server: Connection failed!';

            const sb = document.getElementById('start-btn');
            sb.style.display = 'block';
            sb.classList.remove('is-waiting');
            sb.innerText = 'Connect to Audio';
            showVoiceControls(false);

            isWaitingForMatch = false;
            connected = false;

            if (localUserIdentity) updatePlayerStatus(localUserIdentity, "Not Connected", "status-offline");

            if (trackerSocket && trackerSocket.readyState === WebSocket.OPEN) {
                trackerSocket.send("CANCEL_JOIN");
            }

            return false;
        }
    }
</script>
